<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="8" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-dasharray="800" stroke-dashoffset="100" opacity="0.4" />

  <!-- Stylized R Path -->
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="140" y="128" width="48" height="256" rx="24" fill="url(#primaryGrad)" />
    <!-- Top Loop of R -->
    <path d="M 170 128 H 280 C 330 128 360 160 360 208 C 360 256 330 288 280 288 H 170 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="44" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Diagonal Leg of R -->
    <path d="M 260 270 L 350 384" fill="none" stroke="url(#primaryGrad)" stroke-width="44" stroke-linecap="round" />
  </g>

  <!-- Verification Checkmark Badge -->
  <g transform="translate(320, 310)">
    <circle cx="50" cy="50" r="54" fill="#0F172A" stroke="#1E293B" stroke-width="6" />
    <circle cx="50" cy="50" r="44" fill="url(#checkGrad)" />
    <path d="M 32 50 L 44 62 L 68 38" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
